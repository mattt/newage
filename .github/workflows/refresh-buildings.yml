name: Refresh buildings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 1 * *"

permissions:
  contents: read

concurrency:
  group: refresh-buildings
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          brew bundle
          npm ci
      - name: Test transformations
        run: uv run scripts/test_process_buildings.py
      - name: Rebuild buildings and statistics
        run: uv run scripts/process_buildings.py
      - name: Build and inspect PMTiles
        run: |
          bash scripts/build_tiles.sh
          pmtiles show data/portland_buildings.pmtiles
          pmtiles verify data/portland_buildings.pmtiles
      - name: Upload tiles when credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            npx wrangler r2 object put ageofthe-city/portland_buildings.pmtiles \
              --file=data/portland_buildings.pmtiles --remote
          else
            echo "::notice::Skipping R2 upload: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets are both required."
          fi

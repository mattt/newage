name = "ageofthe-city"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# Serve only on the custom domains, not on workers.dev or preview URLs.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ageofthe.city", custom_domain = true },
  { pattern = "www.ageofthe.city", custom_domain = true },
]

[build]
command = "node scripts/build.ts"
watch_dir = ["src", "../frontend"]

# The Worker runs first for every request,
# so that it can redirect www, serve tiles, and add response headers.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ageofthe-city"

[vars]
CANONICAL_HOST = "ageofthe.city"

[observability]
enabled = true
